# C owns this overlay; shared data and evaluation contracts remain fixed.
serving:
  feature_store: redis
  evaluation:
    nprobe_sweep: [1, 4, 8, 16, 32]
  redis:
    timeout_seconds: 0.2
    max_connections: 32
    write_retries: 8
    db: 0
  ab_test:
    control: popularity
    treatment: full_pipeline
    users_per_group: 5000
    days: 30
    top_n: 10
    # Dev keeps the same population fraction and duration; full uses 5,000/arm.
    dev_population_fraction: 0.2
    outcome:
      click_base: 0.35
      category_weight: 1.0
      price_penalty: 2.0
      position_decay: 0.25
      conversion_multiplier: 1.0
  ct:
    enabled: true
    poll_seconds: 60
    recent_seconds: 86400
    attribution_seconds: 3600
    min_mature_requests: 20
    ctr_threshold: 0.01
    # Event threshold and HitRate threshold inherit the shared ct defaults.
    promotion_metric: ctr_auc
    min_improvement: 0.001
    promotion_floor: 0.70
