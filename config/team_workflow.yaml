version: 6
repository: https://github.com/k-pang-2026/mm-recsys.git
base_branch: main
auto_push: false
push_requires_user_approval: true
pull_requests:
  required: true
  base: main
  merge_requires_user_approval: false
  auto_merge_when_safe: true
  merge_poll_seconds: 10
  merge_wait_seconds: 600
  merge_method: merge
  api_version: '2026-03-10'
  timeout_seconds: 30
  required_ci_check: common
team:
  A: {name: 이제원, github: null, branch: feat/A/search, focus: 공통 준비·검색·Docker·컨테이너 성능·제출 문서·최종 통합}
  B: {name: 박정욱, github: null, branch: feat/B/recommendation, focus: 추천 모델·재랭킹·세션}
  C: {name: 박채영, github: null, branch: feat/C/platform, focus: Redis·서빙·평가·대시보드·A/B·CT}
order:
  A: [B2a, B2b, B10, B11, INTEGRATE]
  B: [B3a, B3b, B4, B5]
  C: [B6, B7, B8, B9]
stages:
  SHARED: {owner: A, requires: [], branch: chore/shared-foundation, pr_ready: true}
  # Explicitly requested workflow maintenance; never selected by normal role progression.
  WORKFLOW:
    owner: A
    requires: [SHARED]
    branch: chore/team-workflow
    pr_ready: true
    paths: [AGENTS.md, README.md, config.yaml, config/recommend.yaml, dashboard/app.py, src/common/config.py, src/common/schemas.py, src/simulator/events.py, src/simulator/generate.py, src/search/api.py, src/serving/main.py, src/serving/model_loader.py, src/serving/ct_admin.py, src/serving/feature_store.py, src/serving/stream_features.py, src/recommendation/datasets.py, src/recommendation/recommender.py, src/recommendation/reranking.py, src/recommendation/scoring.py, src/recommendation/ranking_labels.py, src/recommendation/train_two_tower.py, src/recommendation/train_deepfm.py, src/recommendation/train_session.py, src/ct/retrain_trigger.py, src/evaluation/reporting.py, src/evaluation/recommendation.py, src/evaluation/run_all.py, src/evaluation/verify_evaluation.py, docker/quality.py, docker/simulator.py, scripts/prepare_all.py, tests/test_redis_features.py, tests/test_ponytail_refactor.py, tests/test_checklist_fixes.py, tests/test_simulator.py, setup_env.sh, tests/test_setup_env.py, config/team_workflow.yaml, skills/ponytail/, skills/ponytail-audit/, skills/ponytail-source.json, skills/PONYTAIL_LICENSE, ai_step_prompts_optimized.md, docs/ai_step_prompts.md, docs/team_workflow.md, docs/codex_quickstart.md, docs/pr_workflow.md, docs/contracts.md, docs/commit_convention.md, docs/setup_analysis.md, docs/search_report.md, docs/contributions/A.md, docs/results/experiments/A/workflow_, scripts/team.py, scripts/step_git.py, scripts/pull_request.py, tests/test_team_workflow.py, tests/test_pull_request.py]
  B2a: {owner: A, requires: [SHARED]}
  B2b: {owner: A, requires: [B2a], pr_ready: true}
  B3a: {owner: B, requires: [SHARED]}
  B3b: {owner: B, requires: [B3a]}
  B4: {owner: B, requires: [B3b]}
  B5: {owner: B, requires: [B4], pr_ready: true}
  B6: {owner: C, requires: [SHARED]}
  B7: {owner: C, requires: [B5, B6]}
  B8: {owner: C, requires: [B2b, B7]}
  B9: {owner: C, requires: [B8], pr_ready: true}
  B10:
    owner: A
    requires: [B2b, B5, B9]
    branch: feat/A/docker
    pr_ready: true
    # A completes Docker instructions here and submission documentation in the subsequent B11 PR.
    paths: [docker/, docker-compose.yml, .dockerignore, scripts/prepare_all, scripts/smoke_test, tests/test_docker, docs/results/latency, docs/results/docker, docs/results/experiments/A/, docs/contributions/A.md, README.md]
  B11:
    owner: A
    requires: [B9, B10]
    branch: feat/A/submission
    pr_ready: true
    paths: [README.md, docs/ab_test_report.md, docs/submission/, docs/data_sources.md, scripts/check_submission, tests/test_submission, docs/results/final, docs/results/experiments/A/, docs/contributions/A.md]
  INTEGRATE: {owner: A, requires: [B2b, B5, B10, B11], branch: feat/integration, pr_ready: true}
# Prefix matching, extended only by the integrator after shared-contract review.
paths:
  A: [src/search/, tests/test_search, tests/test_encoder, tests/test_index, config/search.yaml, docs/search_report.md, docs/results/search, docs/results/experiments/A/, docs/contributions/A.md, docker/, docker-compose.yml, .dockerignore, scripts/prepare_all, scripts/smoke_test, tests/test_docker, docs/results/latency, docs/results/docker, README.md, docs/ab_test_report.md, docs/submission/, docs/data_sources.md, scripts/check_submission, tests/test_submission, docs/results/final]
  B: [src/recommendation/, tests/test_two_tower, tests/test_candidate, tests/test_ranking, tests/test_deepfm, tests/test_reranking, tests/test_session, config/recommend.yaml, docs/recommend_report.md, docs/results/candidate, docs/results/ranking, docs/results/session, docs/results/experiments/B/, docs/contributions/B.md]
  C: [src/serving/, src/evaluation/, src/ct/, dashboard/, scripts/train_all, tests/test_redis, tests/test_feature, tests/test_ab, tests/test_evaluation, tests/test_dashboard, tests/test_ct, tests/test_api, tests/test_integration, config/serving.yaml, .github/, docs/results/ab, docs/results/evaluation, docs/results/ct, docs/results/experiments/C/, docs/contributions/C.md]
