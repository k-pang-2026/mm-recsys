# B owns this overlay; top-level key stays recommend.
recommend:
  candidate_config_snapshot: docs/results/candidate_config_original.json
  ranking:
    embedding_dim: 16
    hidden_dims:
    - 128
    - 64
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 1024
    epochs: 20
    patience: 3
    threads: 1
    attribution_seconds: 1800
    cvr_loss_weight: 1.0
    cross_features: true
  candidate:
    embedding_dim: 16
    hidden_dim: 128
    weight_decay: 0.0001
    threads: 4
    num_workers: 0
    history_pooling: mean
    item_id_residual: false
    profile_categories: category_l3
    tiny_fit_steps: 160
    tiny_fit_learning_rate: 0.01
  baselines:
    category_weight: 1.0
    brand_weight: 1.0
    price_weight: 0.25
    popularity_weight: 0.25
  diagnostics:
    rare_max_train_events: 2
    cold_max_history: 4
