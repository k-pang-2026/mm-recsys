search:
  clip_model: openai/clip-vit-base-patch32
  batch_size: 32
  top_k: 10
  clip_revision: 3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
  faiss:
    type: HNSW
    metric: inner_product
    M: 32
    ef_construction: 200
    ef_search: 128
    threads: 4
    nlist: 256
    m: 16
    nbits: 8
    nprobe: 16
  fusion:
    text_weight: 0.5
    image_weight: 0.5
  query_fusion:
    text_weight: 0.5
    image_weight: 0.5
  evaluation:
    relevance: observable_attributes
    queries_per_mode: 200
    ann_recall_k: 10
recommend:
  candidate_k: 300
  top_n: 10
  exclude_purchased: false
  candidate:
    dim: 64
    history_n: 50
    batch_size: 512
    epochs: 20
    patience: 3
    learning_rate: 0.001
    temperature: 0.1
    negatives_per_positive: 4
    loss: sampled_softmax
    positive_weights:
      view: 0.2
      cart: 0.6
      purchase: 1.0
    faiss:
      type: HNSW
      metric: inner_product
      M: 32
      ef_search: 512
  evaluation:
    cutoff_policy: fixed_origin
    target_events:
    - cart
    - purchase
    aggregation: macro_user
    k: 300
    coverage_top_n: 50
    coverage_users: 10000
    min_history: 0
  mab:
    algo: epsilon_greedy
    epsilon: 0.1
  new_item_days: 7
  max_consecutive_same_category: 2
  cold_start_min_events: 5
split:
  train: 0.8
  valid: 0.1
  test: 0.1
ct:
  hitrate_threshold: 0.2
  retrain_log_threshold: 10000
redis:
  host: redis
  port: 6379
benchmark:
  warmup: 10
  requests: 100
  concurrency: 1
targets:
  mrr: 0.55
  ndcg_at_10: 0.5
  recall_at_300: 0.3
  auc: 0.7
  hit_rate_at_50: 0.2
  ndcg_at_50: 0.08
  coverage: 0.2
  candidate_p95_ms: 100
  search_p95_ms: 200
  recommend_p95_ms: 200
  feature_p95_ms: 10
serving:
  feature_store: memory
  history_limit: 50
  session_ttl_seconds: 1800
  feedback_ttl_seconds: 86400
  plugins:
    search: src.search.service
    recommend: src.recommendation.service
