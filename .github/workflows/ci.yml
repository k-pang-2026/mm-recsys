name: Common and application checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Check scripts
        run: |
          bash -n setup_env.sh
          bash -n scripts/codex_run.sh
      - name: Configuration, data, API, feature and automation tests
        run: python -m pytest -q tests
      - name: Store test outcome
        if: always()
        run: echo 'Model full-quality and Docker reproduction are separate stage gates.'
