x-runtime: &runtime
  env_file: .env
  environment: &environment
    SCALE: ${SCALE:-dev}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    API_URL: http://api-server:8000
    HF_HOME: /app/.cache/huggingface
    PYTHONHASHSEED: "42"
    TOKENIZERS_PARALLELISM: "false"
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    SERVING_THREADS: ${SERVING_THREADS:-2}
    SERVING_PARALLEL_HYBRID: ${SERVING_PARALLEL_HYBRID:-1}
    SERVING_GC_FREEZE: ${SERVING_GC_FREEZE:-1}
    PREPARE_TIMEOUT_SECONDS: ${PREPARE_TIMEOUT_SECONDS:-21600}
    READY_TIMEOUT_SECONDS: ${READY_TIMEOUT_SECONDS:-21600}
    DOCKER_RUNTIME: "1"
  volumes:
    - ./data:/app/data
    - ./models:/app/models
    - ./docs/results:/app/docs/results
    - hf_cache:/app/.cache/huggingface

services:
  redis:
    image: redis:7
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-server:
    <<: *runtime
    build: {context: ., dockerfile: docker/Dockerfile.api}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    mem_limit: 4g
    cpus: 4
    init: true

  dashboard:
    build: {context: ., dockerfile: docker/Dockerfile.dashboard}
    env_file: .env
    environment:
      SCALE: ${SCALE:-dev}
      API_URL: http://api-server:8000
      RESULTS_DIR: docs/results/docker/runtime/${SCALE:-dev}
    ports: ["127.0.0.1:${DASHBOARD_PORT:-8501}:8501"]
    depends_on:
      api-server: {condition: service_healthy}
    volumes: ["./docs/results:/app/docs/results:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  simulator:
    <<: *runtime
    build: {context: ., dockerfile: docker/Dockerfile.simulator}
    depends_on:
      redis: {condition: service_healthy}
      api-server: {condition: service_healthy}
    init: true
    mem_limit: 512m

volumes:
  hf_cache:
  redis_data:
